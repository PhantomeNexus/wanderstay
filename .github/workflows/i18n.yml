name: i18n

on:
  pull_request:
    paths:
      - 'messages/**'
      - 'scripts/check-messages.mjs'
      - '.github/workflows/i18n.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm ci
      - run: npm run i18n:check
